name: Deploy Gearcord Bot

on:
  push:
    branches: [ "main" ] # Veya kullandığınız ana branch adı (main / master)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: trado
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/trado/Gearcord
            git pull
            /home/trado/Gearcord/.venv/bin/pip install -r requirements.txt
            sudo systemctl restart gearcord.service